<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NURSAY</title>
<style>
:root{--bg:#f5f6ff;--card:#fff;--tx:#12163a;--mut:#5b6190;--bd:#e2e4f5;--p:#7c3aed;--b:#3b82f6;--n:#0b1030;--g:linear-gradient(135deg,#7c3aed,#3b82f6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070a22;--card:#10153a;--tx:#eef0ff;--mut:#9aa1d4;--bd:#222a5c;color-scheme:dark}}
:root[data-theme=dark]{--bg:#070a22;--card:#10153a;--tx:#eef0ff;--mut:#9aa1d4;--bd:#222a5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
h1,h2,h3{margin:0}button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #7c3aed55}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.s{padding:6px 10px;font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;transition:.25s}.card:hover{transform:translateY(-3px)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;align-items:center;padding:10px 14px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.logo{font-weight:800;font-size:20px;background:var(--g);-webkit-background-clip:text;color:transparent;cursor:pointer;white-space:nowrap}
.sw{position:relative;flex:1}#res{position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
#res div{padding:9px 12px;cursor:pointer}#res div:hover{background:var(--bg)}
.layout{display:flex}.side{width:220px;padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;border-right:1px solid var(--bd)}
.side a{display:flex;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:500}.side a:hover{background:var(--card)}.side a.on{background:var(--g);color:#fff}
main{flex:1;padding:18px;min-width:0;max-width:1100px;margin:auto;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(10px)}}

.hero h1{font-size:clamp(30px,6vw,56px);font-weight:800}.hero p{margin:14px 0 22px;color:#c9ceff}

.opt{display:block;width:100%;text-align:left;margin:6px 0}.ok{border-color:#10b981!important;background:#10b98122!important}.no{border-color:#ef4444!important;background:#ef444422!important}
footer{padding:30px 18px;text-align:center;color:var(--mut)}
@media(max-width:760px){.side{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;display:flex;overflow:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);z-index:25;border-top:1px solid var(--bd);border-right:0}.side a{flex-direction:column;font-size:11px;align-items:center;padding:6px 10px;white-space:nowrap}main{padding-bottom:90px}}
</style></head><body>
<div class="top"><span class="logo" data-go="home">NURSAY</span>
<div class="sw"><input id="q" placeholder="🔍" autocomplete="off"><div id="res" hidden></div></div>
<select id="lang" style="width:auto"><option value="uz">UZ</option><option value="en">EN</option><option value="ru">RU</option></select>
<button class="btn o s" id="th" aria-label="theme">🌓</button></div>
<div class="layout"><nav class="side" id="nav" hidden></nav><main id="app"></main></div>
<footer id="foot"></footer>
<script>
const L={
uz:{home:"Bosh sahifa",dash:"Panel",ai:"AI yordamchi",hw:"Uy vazifa",quiz:"Viktorina",eng:"Ingliz tili",it:"IT Akademiya",plan:"Rejalashtiruvchi",lib:"Kutubxona",prof:"Profil",h:"Bilim — kelajaging kaliti!",d:"NURSAY — o‘quvchilar uchun barchasi bir joyda: AI yordamchi, uy vazifa, viktorina, ingliz tili, dasturlash va kundalik reja.",start:"O‘qishni boshlash",add:"Qo‘shish",del:"O‘chirish",title:"Sarlavha",subj:"Fan",dl:"Muddat",req:"Majburiy maydon",email:"Email noto‘g‘ri",name:"Ismingiz",goal:"Maqsadingiz",save:"Saqlash",hi:"Yuqori",me:"O‘rta",lo:"Past",send:"Yuborish",ask:"Savol bering…",tools:"Asosiy vositalar",cats:"Mashhur yo‘nalishlar",ach:"Yutuqlar",tes:"Fikrlar",done:"Bajarildi",reset:"Ma’lumotlarni tozalash",link:"Havola (https://…)",cat:"Toifa",none:"Hozircha bo‘sh",next:"Keyingi",again:"Qayta",lesson:"Darsni tugatdim",login:"Kirish"},
en:{home:"Home",dash:"Dashboard",ai:"AI Assistant",hw:"Homework",quiz:"Quiz",eng:"English",it:"IT Academy",plan:"Planner",lib:"Library",prof:"Profile",h:"Knowledge is the key to your future!",d:"NURSAY — everything for students in one place: AI assistant, homework, quizzes, English, programming and a daily planner.",start:"Start Learning",add:"Add",del:"Delete",title:"Title",subj:"Subject",dl:"Deadline",req:"Required field",email:"Invalid email",name:"Your name",goal:"Your goal",save:"Save",hi:"High",me:"Medium",lo:"Low",send:"Send",ask:"Ask a question…",tools:"Featured tools",cats:"Popular categories",ach:"Achievements",tes:"Testimonials",done:"Done",reset:"Reset my data",link:"Link (https://…)",cat:"Category",none:"Nothing yet",next:"Next",again:"Retry",lesson:"Mark lesson complete",login:"Sign in"},
ru:{home:"Главная",dash:"Панель",ai:"AI помощник",hw:"Домашка",quiz:"Викторина",eng:"Английский",it:"IT Академия",plan:"Планировщик",lib:"Библиотека",prof:"Профиль",h:"Знание — ключ к будущему!",d:"NURSAY — всё для учёбы в одном месте: AI помощник, домашние задания, викторины, английский, программирование и планировщик.",start:"Начать обучение",add:"Добавить",del:"Удалить",title:"Название",subj:"Предмет",dl:"Срок",req:"Обязательное поле",email:"Неверный email",name:"Ваше имя",goal:"Ваша цель",save:"Сохранить",hi:"Высокий",me:"Средний",lo:"Низкий",send:"Отправить",ask:"Задайте вопрос…",tools:"Основные инструменты",cats:"Популярные направления",ach:"Достижения",tes:"Отзывы",done:"Готово",reset:"Сбросить данные",link:"Ссылка (https://…)",cat:"Категория",none:"Пока пусто",next:"Далее",again:"Заново",lesson:"Урок пройден",login:"Войти"}};
const ICON={dash:"📊",ai:"🤖",hw:"📚",quiz:"🧠",eng:"🇬🇧",it:"💻",plan:"✅",lib:"🗂️",prof:"👤"};
const PAGES=["dash","ai","hw","quiz","eng","it","plan","lib","prof"];
const QZ=[["HTML nima?","Dasturlash tili","Belgilash tili","Ma’lumotlar bazasi",1,"HTML (HyperText Markup Language) — veb sahifa tuzilmasini belgilash tili."],
["2 + 2 × 3 = ?","12","8","10",1,"Avval ko‘paytirish: 2×3=6, keyin 2+6=8."],
["Choose: She ___ to school every day.","go","goes","going",1,"He/She/It bilan Present Simple’da fe’lga -s/-es qo‘shiladi."],
["CSS nima uchun ishlatiladi?","Dizayn berish","Server yozish","Baza saqlash",0,"CSS sahifaga ranglar, joylashuv va uslub beradi."],
["Python’da ro‘yxat qaysi?","(1,2)","[1,2]","{1,2}",1,"Kvadrat qavs [ ] ro‘yxat (list) belgisi."]];
const WORDS=[["knowledge","bilim"],["future","kelajak"],["homework","uy vazifa"],["deadline","muddat"],["practice","mashq"],["goal","maqsad"]];
const LESSONS=[["Dasturlashga kirish","Dastur — kompyuterga berilgan ko‘rsatmalar ketma-ketligi. Algoritm — muammoni hal qilish qadamlari."],["O‘zgaruvchilar","O‘zgaruvchi — ma’lumot saqlovchi quti. Masalan: yosh = 15; ism = \"Ali\"."],["Shartlar (if)","if yosh >= 18: print('Katta'). Shart bajarilsa kod ishlaydi, aks holda else."],["Sikllar","for i in range(5): print(i) — kodni bir necha marta takrorlaydi."]];
const CATS=[["💻","Dasturlash"],["🇬🇧","Ingliz tili"],["🧮","Matematika"],["🔬","Fan"],["🎨","Dizayn"],["📖","Adabiyot"]];
const TES=[["Madina, 10-sinf","Uy vazifalarni endi hech qachon unutmayman!"],["Jasur, talaba","IT darslari o‘zbek tilida — juda qulay."],["Dilnoza, o‘qituvchi","Viktorinalar o‘quvchilarimni rag‘batlantiradi."]];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF={lang:"uz",name:"",email:"",goal:"",hw:[],tasks:[],lib:[],quiz:{best:0,runs:0},words:[],lessons:[],ex:0,xp:0,chat:[]};
let S=structuredClone(DEF),view="home",ref=null,tmr,qs={i:0,sc:0,pick:null};
const t=k=>(L[S.lang]||L.uz)[k]||k;
async function init(){const th=localStorage.getItem("zh-th");if(th)document.documentElement.dataset.theme=th;
 try{const u=await claude.use("user");const db=await claude.use("db");if(u&&db){const id=await u.id();ref=db.doc("data/users/"+id+"/app");const s=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(r,10000))]);if(s.exists)S={...DEF,...s.data()}}}catch(e){}
 if(!ref){try{S={...DEF,...JSON.parse(localStorage.getItem("zh-s")||"{}")}}catch(e){}}
 $("#lang").value=S.lang;render()}
function save(){localStorage.setItem("zh-s",JSON.stringify(S));clearTimeout(tmr);if(ref)tmr=setTimeout(()=>ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{}),500)}
function go(v){view=v;render();scrollTo(0,0)}
function xp(n){S.xp+=n;save()}
function render(){document.documentElement.lang=S.lang;$("#q").placeholder="🔍 "+t("hw")+", "+t("lib")+"…";
 const nav=$("#nav");nav.hidden=view==="home";nav.innerHTML=PAGES.map(p=>`<a data-go="${p}" class="${p===view?"on":""}">${ICON[p]} <span>${t(p)}</span></a>`).join("");
 $("#app").innerHTML=(V[view]||V.home)();$("#app").style.animation="none";void $("#app").offsetWidth;$("#app").style.animation="";
 $("#foot").innerHTML=`© 2026 NURSAY · nursay@example.com · <a href="#" style="color:inherit">Telegram</a> · <a href="#" style="color:inherit">Instagram</a>`;}
const lvl=()=>Math.floor(S.xp/100)+1;
const empty=()=>`<p class="mut">${t("none")}</p>`;
const V={
home(){const n=S.name?" ✓":"";return `<section class="hero"><em>BILIM · RIVOJLANISH · KELAJAK</em><h1>${t("h").replace(/(kelajaging|future|будущему)/,"<span>$1</span>")}</h1><p>${t("d")}</p><button class="btn" data-act="start">${t("start")} →</button></section>
<h2>${t("tools")}</h2><div class="grid" style="margin:12px 0 28px">${PAGES.slice(1).map(p=>`<div class="card" data-go="${p}" style="cursor:pointer"><div style="font-size:28px">${ICON[p]}</div><h3>${t(p)}</h3></div>`).join("")}</div>
<h2>${t("cats")}</h2><div class="grid" style="margin:12px 0 28px">${CATS.map(c=>`<div class="card" data-go="lib" data-cat="${c[1]}" style="cursor:pointer">${c[0]} ${c[1]}</div>`).join("")}</div>
<div class="grid" style="margin-bottom:28px">${[["50K+","O‘quvchilar"],["1200+","Dars"],["300+","Viktorina"],["98%","Mamnunlik"]].map(s=>`<div class="card"><div class="stat">${s[0]}</div><div class="mut">${s[1]}</div></div>`).join("")}</div>
<h2>${t("tes")}</h2><div class="grid" style="margin-top:12px">${TES.map(s=>`<div class="card">“${s[1]}”<div class="mut" style="margin-top:8px">— ${s[0]}</div></div>`).join("")}</div>`},
dash(){const o=S.hw.filter(h=>!h.d).length,td=S.tasks.filter(x=>x.d).length;return `<h2>👋 ${esc(S.name)}</h2><p class="mut">${esc(S.goal)}</p><div class="grid" style="margin:14px 0">
<div class="card"><div class="stat">${o}</div><div class="mut">${t("hw")}</div></div><div class="card"><div class="stat">${td}/${S.tasks.length}</div><div class="mut">${t("plan")}</div></div>
<div class="card"><div class="stat">${S.quiz.best}/${QZ.length}</div><div class="mut">${t("quiz")}</div></div><div class="card"><div class="stat">${S.xp} XP</div><div class="mut">Lvl ${lvl()}</div></div></div>
<div class="card"><h3>${t("eng")}</h3><div class="bar"><i style="width:${S.words.length/WORDS.length*100}%"></i></div><br><h3>${t("it")}</h3><div class="bar"><i style="width:${S.lessons.length/LESSONS.length*100}%"></i></div></div>`},
ai(){return `<h2>🤖 ${t("ai")}</h2><div class="card" style="margin:12px 0;min-height:240px" id="chat">${S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.c)}</div>`).join("")||empty()}</div>
<div class="row"><input id="aq" placeholder="${t("ask")}"><button class="btn" data-act="ask">${t("send")}</button></div><div class="err" id="aer"></div>`},
hw(){return `<h2>📚 ${t("hw")}</h2><form class="card row" data-f="hw" style="margin:12px 0" novalidate><input name="subj" placeholder="${t("subj")}" style="flex:1;min-width:110px"><input name="title" placeholder="${t("title")}" style="flex:2;min-width:140px"><input name="dl" type="date" style="flex:1"><button class="btn">${t("add")}</button><div class="err" style="width:100%"></div></form>
${[...S.hw].sort((a,b)=>a.dl.localeCompare(b.dl)).map(h=>`<div class="card row" style="margin-bottom:8px"><input type="checkbox" style="width:auto" data-tg="hw" data-id="${h.id}" ${h.d?"checked":""}><div class="sp ${h.d?"done":""}"><b>${esc(h.title)}</b><div class="mut">${esc(h.subj)} · ${h.dl}</div></div><button class="btn o s" data-rm="hw" data-id="${h.id}">✕</button></div>`).join("")||empty()}`},
quiz(){if(qs.i>=QZ.length)return `<div class="card" style="text-align:center"><h2>${qs.sc}/${QZ.length} 🎉</h2><p class="mut">Best: ${S.quiz.best}</p><button class="btn" data-act="qre">${t("again")}</button></div>`;
 const q=QZ[qs.i];return `<h2>🧠 ${t("quiz")} ${qs.i+1}/${QZ.length}</h2><div class="card" style="margin-top:12px"><h3>${q[0]}</h3>${[1,2,3].map((_,k)=>`<button class="btn o opt ${qs.pick!=null?(k===q[4]?"ok":k===qs.pick?"no":""):""}" data-act="qa" data-k="${k}" ${qs.pick!=null?"disabled":""}>${q[k+1]}</button>`).join("")}${qs.pick!=null?`<p>💡 ${q[5]}</p><button class="btn" data-act="qn">${t("next")}</button>`:""}</div>`},
eng(){return `<h2>🇬🇧 ${t("eng")}</h2><div class="grid" style="margin:12px 0">${WORDS.map((w,i)=>`<div class="card"><h3>${w[0]}</h3><div class="mut">${w[1]}</div><br><button class="btn ${S.words.includes(i)?"":"o"} s" data-act="wd" data-k="${i}">${S.words.includes(i)?"✓ ":""}${t("done")}</button></div>`).join("")}</div>
<div class="card"><h3>Daily exercise</h3><p>He ___ (like) football.</p><form class="row" data-f="ex" novalidate><input name="a" placeholder="..." style="flex:1"><button class="btn">OK</button></form><div class="err"></div><div class="mut">Streak: ${S.ex} ✔</div></div>`},
it(){return `<h2>💻 ${t("it")}</h2><div class="bar" style="margin:10px 0"><i style="width:${S.lessons.length/LESSONS.length*100}%"></i></div>${LESSONS.map((l,i)=>`<div class="card" style="margin-bottom:10px"><h3>${i+1}. ${l[0]} ${S.lessons.includes(i)?"✅":""}</h3><p class="mut">${l[1]}</p><button class="btn s ${S.lessons.includes(i)?"o":""}" data-act="ls" data-k="${i}">${t("lesson")}</button></div>`).join("")}`},
plan(){const P={h:1,m:2,l:3};return `<h2>✅ ${t("plan")}</h2><form class="card row" data-f="task" style="margin:12px 0" novalidate><input name="title" placeholder="${t("title")}" style="flex:3;min-width:150px"><select name="p" style="flex:1"><option value="h">${t("hi")}</option><option value="m" selected>${t("me")}</option><option value="l">${t("lo")}</option></select><button class="btn">${t("add")}</button><div class="err" style="width:100%"></div></form>
${[...S.tasks].sort((a,b)=>a.d-b.d||P[a.p]-P[b.p]).map(x=>`<div class="card row" style="margin-bottom:8px"><input type="checkbox" style="width:auto" data-tg="tasks" data-id="${x.id}" ${x.d?"checked":""}><span class="sp ${x.d?"done":""}">${esc(x.title)}</span><span class="tag ${x.p==="h"?"hi":x.p==="m"?"me":"lo"}">${t({h:"hi",m:"me",l:"lo"}[x.p])}</span><button class="btn o s" data-rm="tasks" data-id="${x.id}">✕</button></div>`).join("")||empty()}`},
lib(){const c=window.libCat||"";return `<h2>🗂️ ${t("lib")}</h2><form class="card row" data-f="lib" style="margin:12px 0" novalidate><input name="title" placeholder="${t("title")}" style="flex:1;min-width:120px"><input name="url" placeholder="${t("link")}" style="flex:2;min-width:150px"><select name="cat">${CATS.map(x=>`<option ${x[1]===c?"selected":""}>${x[1]}</option>`).join("")}</select><button class="btn">${t("add")}</button><div class="err" style="width:100%"></div></form>
<div class="grid">${S.lib.filter(l=>!c||l.cat===c).map(l=>`<div class="card"><span class="tag">${esc(l.cat)}</span><h3 style="margin:8px 0"><a href="${esc(l.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(l.title)}</a></h3><button class="btn o s" data-rm="lib" data-id="${l.id}">${t("del")}</button></div>`).join("")||empty()}</div>`},
prof(){const A=[["🌱","1 XP",S.xp>0],["🧠",t("quiz"),S.quiz.runs>0],["📚","3 "+t("hw"),S.hw.filter(h=>h.d).length>=3],["💻",t("it"),S.lessons.length===LESSONS.length],["🏆","Lvl 3",lvl()>=3]];
 return `<h2>👤 ${t("prof")}</h2><form class="card" data-f="prof" style="margin:12px 0" novalidate><label>${t("name")}</label><input name="name" value="${esc(S.name)}"><label>Email</label><input name="email" value="${esc(S.email)}"><label>${t("goal")}</label><input name="goal" value="${esc(S.goal)}"><div class="err"></div><button class="btn">${t("save")}</button></form>
<div class="card"><div class="stat">Lvl ${lvl()} · ${S.xp} XP</div><div class="bar"><i style="width:${S.xp%100}%"></i></div></div><h3 style="margin:16px 0 8px">${t("ach")}</h3><div class="grid">${A.map(a=>`<div class="card" style="opacity:${a[2]?1:.4}">${a[0]} ${a[1]}</div>`).join("")}</div><br><button class="btn o" data-act="reset">${t("reset")}</button>`}};
function needProfile(){$("#app").innerHTML=`<form class="card" data-f="prof" style="max-width:420px;margin:30px auto" novalidate><h2>${t("login")}</h2><br><label>${t("name")}</label><input name="name"><label>Email</label><input name="email"><label>${t("goal")}</label><input name="goal"><div class="err"></div><button class="btn">${t("start")}</button></form>`;$("#nav").hidden=true}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const FORMS={
hw(f,e){if(!f.subj.value.trim()||!f.title.value.trim()||!f.dl.value)return t("req");S.hw.push({id:uid(),subj:f.subj.value.trim(),title:f.title.value.trim(),dl:f.dl.value,d:false});xp(5)},
task(f){if(!f.title.value.trim())return t("req");S.tasks.push({id:uid(),title:f.title.value.trim(),p:f.p.value,d:false});xp(2)},
lib(f){if(!f.title.value.trim())return t("req");try{const u=new URL(f.url.value.trim());if(!/^https?:$/.test(u.protocol))throw 0}catch(e){return t("link")}S.lib.push({id:uid(),title:f.title.value.trim(),url:f.url.value.trim(),cat:f.cat.value});xp(3)},
ex(f,e){const a=f.a.value.trim().toLowerCase();if(!a)return t("req");if(a==="likes"){S.ex++;xp(10);e.ok=1}else return "✗ likes"},
prof(f){const n=f.name.value.trim();if(n.length<2)return t("req");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim()))return t("email");S.name=n;S.email=f.email.value.trim();S.goal=f.goal.value.trim();if(view==="home")view="dash"}};
document.addEventListener("submit",e=>{const f=e.target;if(!f.dataset.f)return;e.preventDefault();const m=FORMS[f.dataset.f](f,{});if(m){f.querySelector(".err").textContent=m;return}save();render()});
document.addEventListener("change",e=>{const x=e.target;if(x.id==="lang"){S.lang=x.value;save();render()}
 if(x.dataset.tg){const it=S[x.dataset.tg].find(i=>i.id===x.dataset.id);it.d=x.checked;if(x.checked)xp(5);save();render()}});
document.addEventListener("click",async e=>{const x=e.target.closest("[data-go],[data-act],[data-rm],#th");if(!x)return;
 if(x.id==="th"){const d=document.documentElement,n=(d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark";d.dataset.theme=n;localStorage.setItem("zh-th",n);return}
 if(x.dataset.go){window.libCat=x.dataset.cat||"";if(x.dataset.go!=="home"&&!S.name)return needProfile();return go(x.dataset.go)}
 if(x.dataset.rm){S[x.dataset.rm]=S[x.dataset.rm].filter(i=>i.id!==x.dataset.id);save();return render()}
 const a=x.dataset.act,k=+x.dataset.k;
 if(a==="start"){S.name?go("dash"):needProfile()}
 if(a==="qa"){qs.pick=k;if(k===QZ[qs.i][4])qs.sc++;render()}
 if(a==="qn"){qs.i++;qs.pick=null;if(qs.i>=QZ.length){S.quiz.runs++;S.quiz.best=Math.max(S.quiz.best,qs.sc);xp(qs.sc*5)}render()}
 if(a==="qre"){qs={i:0,sc:0,pick:null};render()}
 if(a==="wd"){S.words=S.words.includes(k)?S.words.filter(i=>i!==k):[...S.words,k];xp(3);render()}
 if(a==="ls"){if(!S.lessons.includes(k)){S.lessons.push(k);xp(15)}save();render()}
 if(a==="reset"&&confirm("?")){S={...structuredClone(DEF),lang:S.lang};save();go("home")}
 if(a==="ask"){const i=$("#aq"),v=i.value.trim();if(!v){$("#aer").textContent=t("req");return}
  S.chat.push({r:"u",c:v});i.value="";S.chat=S.chat.slice(-20);render();let sm;try{sm=await claude.use("sample")}catch(_){}
  if(!sm){S.chat.push({r:"a",c:"AI yordamchi hozir mavjud emas."});save();return render()}
  try{const r=await sm([{role:"user",content:`You are NURSAY, a friendly study tutor. Reply in language code "${S.lang}" (uz=Uzbek). Be clear and concise, use simple examples.\nConversation:\n${S.chat.map(m=>m.r+": "+m.c).join("\n")}`}],{cache:false});S.chat.push({r:"a",c:r.text});xp(2)}catch(err){S.chat.push({r:"a",c:"⚠️ "+(err.message||"Error")})}
  save();render()}});
$("#q").addEventListener("input",e=>{const v=e.target.value.trim().toLowerCase(),r=$("#res");if(!v){r.hidden=true;return}
 const items=[...PAGES.map(p=>[ICON[p]+" "+t(p),p]),...S.hw.map(h=>["📚 "+h.title,"hw"]),...S.tasks.map(h=>["✅ "+h.title,"plan"]),...S.lib.map(h=>["🗂️ "+h.title,"lib"]),...LESSONS.map(l=>["💻 "+l[0],"it"]),...WORDS.map(w=>["🇬🇧 "+w[0]+" — "+w[1],"eng"])].filter(i=>i[0].toLowerCase().includes(v)).slice(0,7);
 r.hidden=false;r.innerHTML=items.map(i=>`<div data-go="${i[1]}">${esc(i[0])}</div>`).join("")||`<div>${t("none")}</div>`});
document.addEventListener("click",e=>{if(!e.target.closest(".sw")){$("#res").hidden=true}else if(e.target.closest("#res div")){$("#res").hidden=true;$("#q").value=""}});
init();
</script></body></html>
